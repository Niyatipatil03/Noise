name: Build BSR APK

on:
  push:
    branches: [ ccr-1bb6c244-1kDv4, main, claude/build-apk-4cV6K ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Show resolved dependency versions
        working-directory: flutter_app
        run: |
          echo "=== Key dependency versions ==="
          flutter pub deps 2>&1 | grep -E "tflite|record|permission_handler" || true
          echo "=== AndroidManifest flutterEmbedding ==="
          grep -n "flutterEmbedding" android/app/src/main/AndroidManifest.xml || echo "WARNING: not found"

      - name: Build release APK
        working-directory: flutter_app
        shell: bash
        run: |
          flutter build apk --release --verbose 2>&1 | tee /tmp/build_log.txt
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build_log.txt
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bsr-detector-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
