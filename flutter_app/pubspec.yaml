name: bsr_noise_detector
description: Vehicle BSR Noise Detection — fully offline Flutter app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # TFLite inference (offline) — 0.12.0 uses pure FFI, no v1 embedding
  # Pinned to 0.12.0: 0.12.1 bumped to litert:1.4.0 + compileSdk 36 (incompatible with Flutter 3.24.3 / AGP 8.3)
  tflite_flutter: 0.12.0

  # Audio recording
  record: ^5.0.0

  # Permissions
  permission_handler: ^11.3.0

  # File saving
  path_provider: ^2.1.3

  # Local history storage
  shared_preferences: ^2.3.0

  # Animations
  flutter_animate: ^4.5.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bsr_detector.tflite
    - assets/labels.json
